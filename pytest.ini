# MORE-harvest pytest configuration (mirrors Workstation A).
#
# The ten-minute review ceiling: no single test may run longer than 300 s and no
# session longer than 600 s, so a hung run fails loudly instead of blocking review.
# No markers defined yet; --strict-markers already guards against typos.

[pytest]
testpaths = tests
addopts = -q -ra --strict-markers
timeout = 300
session_timeout = 600
